9<div class="container">
  <h2>Sign Up</h2>
  <form>
    <input
      type="text"
      [(ngModel)]="name"
      name="name"
      placeholder="First and last name"
      required/>
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Enter email"/>
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      required/>
    <button type="button" (click)="signup()">Sign Up</button>
  </form>
  <p>Already have an account? <a (click)="navigateToLogin()">Log In</a></p>
</div>
