<div class="container">
  <h2>Login</h2>
  <form>
    <input type="email"
           [(ngModel)]="email"
           name="email"
           placeholder="Email"
           required />
    <input type="password"
           [(ngModel)]="password"
           name="password"
           placeholder="Password"
           required />
    <button type="button" (click)="signInWithEmail()">Login In</button>
    <button (click)="navigateToInvAdd()">Inventory</button>
  </form>
  <p>Don't have an account? <a (click)="navigateToSignUp()">Sign Up</a></p>
</div>
