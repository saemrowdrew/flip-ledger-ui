<mat-sidenav-container class="sidenav-container">

  <mat-sidenav mode="side" [opened]="true" [disableClose]="true">
    <div class="navigation-title">
      <h1>Navigation Bar</h1>
    </div>
    <div class="navigation-btns">
      <button class="nav-button" (click)="navigateToInvAdd()">Add Item to Inventory</button>
      <button class="nav-button" (click)="navigateToListItem()">List Item to Sell</button>
      <button class="nav-button" (click)="navigateToSellItem()">Sell Item</button>
      <button class="nav-button" (click)="navigateToPerfMetrics()">Performance Metrics</button>
      <button class="nav-button" (click)="navigateToProfile()">Back to Profile</button>
      <button class="nav-button" (click)="signOut()">Sign Out</button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <div class="list-item-header">
      <p class="header-title">List Item</p>
      <img class="header-logo" [src]="flipLedgerLogo" />
    </div>

    <mat-table class="list-item-form" [dataSource]="allActiveInventory()">

      <ng-container matColumnDef="item">
        <mat-header-cell *matHeaderCellDef>Item</mat-header-cell>
        <mat-cell class="item-listed" *matCellDef="let item">{{ item.item_name }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="listed-platform">
        <mat-header-cell *matHeaderCellDef>Platfrom</mat-header-cell>
        <mat-cell *matCellDef="let item">
          <mat-form-field class="listed-platform" appearance="outline">
            <mat-select [(ngModel)]="item.platform_id" [name]="'platform_id' + item.item_id">
              <mat-option class="listed-platform" *ngFor="let platform of platforms()" [value]="platform.platform_id">
                {{ platform.platform_name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="listed-price">
        <mat-header-cell *matHeaderCellDef>Price</mat-header-cell>
        <mat-cell *matCellDef="let item">
          <mat-form-field class="listed-price" appearance="outline">
            <span matTextPrefix>$&nbsp;</span>
            <input matInput placeholder="{{ item.listing_price }}" [(ngModel)]="item.listing_price" [name]="'listing_price_' + item.item_id">
          </mat-form-field>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="listed-date">
        <mat-header-cell class="header-title" *matHeaderCellDef>Date</mat-header-cell>
        <mat-cell *matCellDef="let item">
          <input class="listed-date" matInput placeholder="Enter Listing Date" [matDatepicker]="picker" [(ngModel)]="item.listing_date" (click)="picker.open()">
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="mark-as-listed">
        <mat-header-cell *matHeaderCellDef>List Item</mat-header-cell>
        <mat-cell *matCellDef="let item">
          <button class="list-item-btn" (click)="markAsListed(item)">List Item</button>
        </mat-cell>
      </ng-container>

      <mat-header-row class="row-title" *matHeaderRowDef="displayedColumns"></mat-header-row>

      <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>

    </mat-table>
  </mat-sidenav-content>

</mat-sidenav-container>
